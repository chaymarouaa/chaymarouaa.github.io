#fichier YAML permettant la mise à jour automatique 
#du site web portfolio sur GitHub Pages


name: Deploy portfolio to GitHub Pages

on:
    # Lance automatiquement le déploiement à chaque 
    #push sur la branche main
  push:
    branches:
      - main

  workflow_dispatch:
#workflow_dispatch: Permet de lancer manuellement le 
#déploiement depuis GitHub Actions

# Autorisations nécessaires pour lire le repository 
#et publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Évite que plusieurs déploiements soient lancés simultanément
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Utilise une machine Ubuntu temporaire fournie 
    #par GitHub
    runs-on: ubuntu-latest

    steps:
      # Récupère le contenu du repository
      - name: Checkout
        uses: actions/checkout@v6

      # Installe Node.js pour pouvoir utiliser npm et Vite
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compile le projet React/Vite et génère le dossier dist/
      - name: Build
        run: npm run build

      # Configure l'environnement GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Prépare le dossier dist/ pour être publié 
      - name: Upload build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      # Déploie le site construit sur GitHub Pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4